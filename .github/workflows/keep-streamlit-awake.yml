name: Keep Streamlit apps awake

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Every 6 hours, away from the busy start of the hour.
    # 05:47, 11:47, 17:47, 23:47 India time (UTC+05:30).
    # Streamlit sleeps after 12 hours; GitHub schedules can be delayed.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: false

jobs:
  keep-awake:
    name: Wake and verify ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        app: [FVCC, GRDCC, GWHCC]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/keep_streamlit_awake.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Visit, wake, click and verify app
        run: python scripts/keep_streamlit_awake.py --app "${{ matrix.app }}"
      - name: Save verification screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-${{ matrix.app }}
          path: keep-awake-results/
          retention-days: 7
          if-no-files-found: warn
