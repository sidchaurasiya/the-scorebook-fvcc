name: Keep Streamlit apps awake

on:
  schedule:
    # Runs every 10 hours in UTC.
    # The browser visit creates real Streamlit session traffic, not just an HTTP ping.
    - cron: "0 */10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Visit Streamlit apps
        run: python scripts/keep_streamlit_awake.py
